name: iOS build

# Builds the Capacitor iOS app (mobile/) on a macOS runner — no local Mac
# toolchain needed. Two paths:
#   * build   — always runs, NO secrets. Unsigned simulator build that proves
#               the whole native stack (Swift plugin + onnxruntime-objc pod +
#               Capacitor) compiles. This is the CI gate.
#   * ipa     — runs only on manual dispatch with `signed: true` AND the
#               signing secrets present. Produces an installable .ipa.
#
# Trigger manually from the Actions tab (workflow_dispatch), or on pushes
# that touch the mobile app.

on:
  workflow_dispatch:
    inputs:
      signed:
        description: "Also produce a signed .ipa (needs signing secrets)"
        type: boolean
        default: false
      export_method:
        description: "Signing/export method for the .ipa"
        type: choice
        default: development
        options: [development, ad-hoc, app-store]
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/ios.yml'

jobs:
  # ---- Unsigned build: the always-on CI gate (no secrets required) ----
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install JS deps
        run: npm install

      - name: Build native ONNX plugin
        run: npm run plugin:build

      - name: Add iOS platform (its pod install is redone by the script)
        run: npx cap add ios || true

      - name: Patch Info.plist + Podfile, then pod install
        run: ./scripts/ios-postadd.sh

      # Generate the iOS app icons (incl. the opaque 1024 App Store marketing
      # icon) into the asset catalog from mobile/assets/. App Store Connect
      # reads the 1024 icon straight from the uploaded build.
      - name: Generate app icons
        run: npx capacitor-assets generate --ios --iconBackgroundColor '#102146' --iconBackgroundColorDark '#102146'

      - name: Build (unsigned, simulator)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  # ---- Signed .ipa: opt-in, needs an Apple Developer account + secrets ----
  #
  # Add these repo secrets (Settings -> Secrets and variables -> Actions):
  #   BUILD_CERTIFICATE_BASE64        base64 of your signing cert .p12
  #                                   (`base64 -i cert.p12 | pbcopy`)
  #   P12_PASSWORD                    password you set when exporting the .p12
  #   BUILD_PROVISION_PROFILE_BASE64  base64 of the .mobileprovision
  #   KEYCHAIN_PASSWORD               any throwaway string (temp keychain)
  #   APPLE_TEAM_ID                   your 10-char Team ID
  # For method=app-store (TestFlight upload), ALSO add:
  #   APPSTORE_API_KEY_ID             App Store Connect API Key ID
  #   APPSTORE_API_ISSUER_ID          App Store Connect API Issuer ID
  #   APPSTORE_API_PRIVATE_KEY        base64 of the AuthKey_XXXXXXXX.p8
  # The provisioning profile must match appId `com.danielmedeiros.polaris`
  # and (for `development`/`ad-hoc`) include your device UDIDs. For
  # `app-store`, the app record must already exist in App Store Connect.
  ipa:
    runs-on: macos-15
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      # App Store Connect rejects uploads built with an old iOS SDK — it
      # requires the current SDK (Xcode 26+). Select the newest Xcode on the
      # runner (macos-15 carries Xcode 26).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode + iOS SDKs
        run: xcodebuild -version && xcodebuild -showsdks | grep -i iphoneos || true

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install JS deps
        run: npm install

      - name: Build native ONNX plugin
        run: npm run plugin:build

      - name: Add iOS platform (its pod install is redone by the script)
        run: npx cap add ios || true

      - name: Patch Info.plist + Podfile, then pod install
        run: ./scripts/ios-postadd.sh

      # Generate the iOS app icons (incl. the opaque 1024 App Store marketing
      # icon) into the asset catalog from mobile/assets/. App Store Connect
      # reads the 1024 icon straight from the uploaded build.
      - name: Generate app icons
        run: npx capacitor-assets generate --ios --iconBackgroundColor '#102146' --iconBackgroundColorDark '#102146'

      - name: Install signing cert + provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PP_PATH="$RUNNER_TEMP/pp.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

          # Read the profile's name + UUID so we can sign manually with it
          # (no Apple round-trip → avoids the API-key 401 on xcbuild auth).
          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/pp.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/pp.plist")
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed provisioning profile: $PROFILE_NAME"

      - name: Place App Store Connect API key (for TestFlight upload)
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/private_keys"
          KEYFILE="$HOME/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          # Accept the secret either as the raw .p8 PEM text OR base64 of it.
          if printf '%s' "$APPSTORE_API_PRIVATE_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > "$KEYFILE"
          else
            printf '%s' "$APPSTORE_API_PRIVATE_KEY" | base64 --decode > "$KEYFILE"
          fi
          # Fail fast (without leaking the key) if it isn't a valid PEM.
          if ! grep -q 'BEGIN PRIVATE KEY' "$KEYFILE"; then
            echo "::error::APPSTORE_API_PRIVATE_KEY did not decode to a valid .p8 (no PEM header). Store it as the .p8 file contents or its base64." >&2
            exit 1
          fi
          echo "API key file OK ($(wc -c < "$KEYFILE") bytes)"

      - name: Set a unique build number
        run: |
          # App Store Connect rejects a duplicate CFBundleVersion; Capacitor
          # pins it to "1". Use the workflow run number (monotonic) so every
          # upload is higher than the last.
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $GITHUB_RUN_NUMBER" "$PLIST"
          echo "CFBundleVersion = $GITHUB_RUN_NUMBER"

      - name: Configure the App target for manual signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: |
          # Signing identity for the chosen method. The profile in
          # BUILD_PROVISION_PROFILE_BASE64 must match: App Store / Ad Hoc for
          # app-store/ad-hoc, a Development profile for development.
          case "$EXPORT_METHOD" in
            development) IDENTITY="Apple Development" ;;
            *)           IDENTITY="Apple Distribution" ;;
          esac
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          export IDENTITY

          # Set manual signing ONLY on the App target (NOT globally on the
          # CLI — that hit every Pods target, which don't support profiles).
          gem install --no-document xcodeproj >/dev/null
          ruby - <<'RUBY'
          require 'xcodeproj'
          proj = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          app = proj.targets.find { |t| t.name == 'App' }
          app.build_configurations.each do |c|
            c.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            c.build_settings['DEVELOPMENT_TEAM'] = ENV['APPLE_TEAM_ID']
            c.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV['PROFILE_NAME']
            c.build_settings['CODE_SIGN_IDENTITY'] = ENV['IDENTITY']
            c.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = ENV['IDENTITY']
          end
          proj.save
          puts "App target signing: #{ENV['IDENTITY']} / #{ENV['PROFILE_NAME']}"
          RUBY

      - name: Archive & export .ipa
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>${SIGN_IDENTITY}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.danielmedeiros.polaris</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          EOF

          # Signing is now baked into the App target only (Pods keep their
          # own "no signing"). No signing args on the CLI, no Apple round-trip.
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v7
        with:
          name: Polaris-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 7

      # Only for app-store exports: push the .ipa to TestFlight so it
      # installs over-the-air (no cables, no device UDIDs). Needs the
      # App Store Connect API key secrets and an existing app record.
      - name: Upload to TestFlight
        if: ${{ inputs.export_method == 'app-store' }}
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          echo "Uploading $IPA to TestFlight…"
          xcrun altool --upload-app -f "$IPA" --type ios \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"
