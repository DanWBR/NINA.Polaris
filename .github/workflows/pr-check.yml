name: PR check

# What a pull request is checked against before anyone reads it.
#
# Until now the only workflow that ran on pull_request was book-check, so a
# contribution could be merged without ever being built, tested or parsed.
# That is how a single bad line of JavaScript reached v0.98.136 and left the
# whole interface dead until v0.98.143: app.js did not parse, ninaApp was
# never defined, and every install sat on the loading screen. The front-end
# guard added afterwards runs on tag, which is one step too late. This runs on
# the pull request.
#
# Deliberately on Linux. The maintainer develops on Windows, and the tests that
# matter most here are the ones a Windows machine cannot run: PR #20's symbolic
# link escape tests carry Assert.Ignore("requires Linux") and had been skipped
# on every machine that ever ran them, and the packaging scripts are shell.

on:
  pull_request:
  workflow_dispatch:

# A new push to the same PR makes the previous run pointless.
concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Front-end parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Every script served to the browser parses
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || { echo "::error file=$f::does not parse"; fail=1; }
          done < <(find src/NINA.Polaris/wwwroot -name '*.js' \
                     -not -path '*/sky/*' -not -path '*/phd2-vnc/*' \
                     -not -path '*/graxpert/*' -not -path '*/canopus/*')
          exit $fail

      - name: Every this.x() call has a definition, and no duplicate members
        run: node scripts/check-missing-methods.mjs

      - name: Alpine expressions in index.html parse
        run: node scripts/check-alpine-expressions.mjs

      - name: Locale catalogues are valid JSON
        run: |
          fail=0
          for f in src/NINA.Polaris/wwwroot/data/locales/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              || { echo "::error file=$f::not valid JSON"; fail=1; }
          done
          exit $fail

  build-and-test:
    name: Build and test on Linux
    runs-on: ubuntu-latest
    steps:
      # lfs: false on purpose. The only LFS content is the DSS sky survey,
      # which nothing in the test project reads, and it is 440 MB.
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Build
        run: dotnet build tests/NINA.Polaris.Test/NINA.Polaris.Test.csproj -c Debug --nologo

      # One test is excluded, and this is not a way of hiding it: the colour
      # allocation budget currently fails, reporting 18.3 MB per frame against
      # a 14 MB limit. That is a real regression with its own issue. Leaving it
      # in would make every pull request red for something the contributor did
      # not cause, and a check that is always red is a check nobody reads.
      # Delete the filter the day the budget is met again.
      - name: Test
        run: |
          dotnet test tests/NINA.Polaris.Test/NINA.Polaris.Test.csproj \
            -c Debug --no-build --nologo \
            --filter "FullyQualifiedName!~ColourSession_PerFrameAllocations_StayBounded" \
            --logger "trx;LogFileName=pr.trx"

      - name: Which tests failed
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          for f in glob.glob('tests/**/TestResults/pr.trx', recursive=True):
              for r in ET.parse(f).findall('.//t:UnitTestResult', ns):
                  if r.get('outcome') == 'Failed':
                      msg = r.find('.//t:Message', ns)
                      text = (msg.text or '').strip().replace('\n', ' ')[:300] if msg is not None else ''
                      print('::error::%s: %s' % (r.get('testName'), text))
          PY

  packaging:
    name: Packaging scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Every shell script parses
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::does not parse"; fail=1; }
          done < <(find packaging scripts -name '*.sh' 2>/dev/null)
          exit $fail

      # These guard the two ways Polaris has damaged a working install from its
      # own update path: replacing a vendor SDK with an older one, and letting
      # an archive package overwrite files built from source.
      - name: Installer guards and the SDK repair
        run: |
          fail=0
          for t in sdk-symlinks-test.sh indi-install-test.sh self-update-test.sh; do
            echo "--- $t"
            bash "packaging/deb/tests/$t" || { echo "::error::$t failed"; fail=1; }
          done
          exit $fail
