name: Script runtime pack

# Builds the offline wheel packs (numpy + astropy and their dependencies) that
# the Polaris host installs for polarispy pixel scripts. numpy/astropy are C
# extensions tied to the CPU arch AND the Python minor version, so one pack is
# published per (rid, pyXY). The host (ScriptRuntimeService) downloads the pack
# matching its architecture + system Python, then pip-installs it offline with
# --no-index into a venv.
#
# Run manually (workflow_dispatch). Assets: script-runtime-<rid>-py<XY>.zip.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish the packs to"
        default: "script-runtime"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs-on: ubuntu-latest,    rid: linux-x64,   py: "3.11" }
          - { runs-on: ubuntu-latest,    rid: linux-x64,   py: "3.12" }
          - { runs-on: ubuntu-24.04-arm, rid: linux-arm64, py: "3.11" }
          - { runs-on: ubuntu-24.04-arm, rid: linux-arm64, py: "3.12" }
          - { runs-on: windows-latest,   rid: win-x64,     py: "3.11" }
          - { runs-on: windows-latest,   rid: win-x64,     py: "3.12" }
    runs-on: ${{ matrix.runs-on }}
    # Git Bash on the Windows runners too, so one script covers every OS.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.py }}"

      - name: Download the wheel closure (numpy + astropy)
        run: |
          set -eux
          PYV="${{ matrix.py }}"; PYV="${PYV/./}"     # 3.11 -> 311
          mkdir wheels
          python -m pip install --upgrade pip
          # Full binary dependency closure for THIS interpreter + platform.
          python -m pip download --only-binary=:all: numpy astropy scipy pillow opencv-python-headless -d wheels
          # Zip via Python so we do not depend on a `zip` binary (absent on the
          # Windows runners). Wheels sit at the archive root, as the host expects.
          RID="${{ matrix.rid }}" PYV="$PYV" python - <<'PY'
          import glob, os, zipfile
          name = "script-runtime-%s-py%s.zip" % (os.environ["RID"], os.environ["PYV"])
          with zipfile.ZipFile(name, "w", zipfile.ZIP_DEFLATED) as z:
              for f in sorted(glob.glob("wheels/*")):
                  z.write(f, os.path.basename(f))
          print("wrote", name)
          PY
          ls -lh script-runtime-*.zip

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # gh needs the repo without a checkout
        run: |
          set -eux
          TAG="${{ inputs.release_tag }}"
          gh release create "$TAG" -t "Script runtime packs" \
            -n "numpy + astropy wheel packs for polarispy pixel scripts (per arch + Python version)." \
            || true
          gh release upload "$TAG" script-runtime-*.zip --clobber
