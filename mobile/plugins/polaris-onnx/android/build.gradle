ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
}

buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.2.1' }
}

apply plugin: 'com.android.library'

android {
    namespace "dev.danwbr.polaris.onnx"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories { google(); mavenCentral() }

dependencies {
    implementation project(':capacitor-android')
    // ONNX Runtime Android: NNAPI + XNNPACK + CPU execution providers.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.18.0'
    // AndroidX WebView for addDocumentStartJavaScript (shim injection).
    implementation 'androidx.webkit:webkit:1.11.0'
}
