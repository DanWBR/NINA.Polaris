# Polaris: keep Wi-Fi power saving off. With it on, a Raspberry Pi 5 (and
# other boards with Broadcom radios) drops the connection every few minutes,
# both as a hotspot and as a client, and the app loses the rig mid-session.
# 2 = disable. Applies to every Wi-Fi connection NetworkManager brings up.
[connection]
wifi.powersave = 2
