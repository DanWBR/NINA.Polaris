# Polaris: keep the system journal across reboots and power cuts, so a field
# session (camera stalls, USB resets, driver restarts) can still be read the
# next day. Armbian-style images mount /var/log on zram and set
# Storage=volatile; they also point /var/log/journal at /var/log.hdd/journal
# on the card, which is where this lands. Capped so it can never fill the
# card or wear it noticeably.
[Journal]
Storage=persistent
SystemMaxUse=300M
SystemMaxFileSize=50M
MaxRetentionSec=2month
