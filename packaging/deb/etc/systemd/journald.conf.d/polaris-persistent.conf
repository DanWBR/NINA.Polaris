# Polaris: keep the system journal across reboots and power cuts, so a field
# session (camera stalls, USB resets, driver restarts) can still be read the
# next day. Capped so it can never fill the card or wear it noticeably.
#
# Some board images run /var/log from a small RAM disk (orangepi-ramlog and
# armbian-ramlog: a ~50 MB zram or tmpfs, with the card's own /var/log kept at
# /var/log.hdd; log2ram keeps it at /var/hdd.log). There, /var/log/journal
# would be in RAM, and orangepi-ramlog copies it back into RAM from the card at
# every boot until the RAM disk is full. polaris-journal-to-card.service
# bind-mounts the card's journal directory over /var/log/journal before journald
# starts writing there, so these limits are spent on the card. If it finds no
# card copy, it caps the journal at a fifth of the RAM disk instead.
[Journal]
Storage=persistent
SystemMaxUse=300M
SystemMaxFileSize=50M
MaxRetentionSec=2month
