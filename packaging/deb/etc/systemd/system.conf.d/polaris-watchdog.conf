# Polaris: let the board's hardware watchdog reboot it when the system freezes.
# systemd feeds the watchdog every RuntimeWatchdogSec/2; if PID 1 stops doing
# so for 10 s, the hardware resets the board. Without this, an unattended rig
# that hangs stays dead until someone power-cycles it: an Orange Pi 5 Pro froze
# mid-session with its heartbeat LED still pulsing, no network and nothing in
# the log, and was found that way. A host without a watchdog device ignores it.
# Takes effect at the next boot.
#
# 10 s because the timeout must fit the hardware: the Allwinner watchdog
# (sunxi-wdt: Orange Pi Zero 3, 4 Pro) stops at 16 s and the Raspberry Pi's at
# 15 s. At 30 s an Orange Pi 4 Pro kept its 16 s while systemd fed it every
# 15 s, and reset itself about 16 s into every boot. The reboot watchdog is
# off for the same reason: a longer one than the hardware allows would cut a
# slow shutdown short instead of rescuing a stuck one.
[Manager]
RuntimeWatchdogSec=10s
RebootWatchdogSec=off
