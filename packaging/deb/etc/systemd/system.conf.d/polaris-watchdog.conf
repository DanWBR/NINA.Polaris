# Polaris: let the board's hardware watchdog reboot it when the system freezes.
# systemd feeds the watchdog every RuntimeWatchdogSec/2; if PID 1 stops doing
# so for 30 s, the hardware resets the board. Without this, an unattended rig
# that hangs stays dead until someone power-cycles it: an Orange Pi 5 Pro froze
# mid-session with its heartbeat LED still pulsing, no network and nothing in
# the log, and was found that way. A host without a watchdog device ignores it.
# Takes effect at the next boot.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=2min
