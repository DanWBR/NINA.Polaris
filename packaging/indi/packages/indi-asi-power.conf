# Per-package config for build-driver-deb.sh — ZWO ASIAIR power ports
# (indi-asi-power, from indi-3rdparty). This is the one driver whose target
# hardware is known exactly: the ASIAIR Pro enclosure's four 12 V outputs on a
# Raspberry Pi 4 (GPIO 12/13/26/18, DSLR shutter on 21, per-port V/A over I2C).
# Reported as issue #8.
#
# NOTE — Debian 13 (trixie) build caveat, why this needs more than the usual
# `make install` before build-driver-deb.sh can package it:
#   * The driver links libpigpiod_if2 (the pigpio client). On trixie
#     `libpigpiod-if2-1` + `libpigpiod-if-dev` exist, but `libpigpio-dev`
#     (ships pigpio.h) and the `pigpiod` daemon package do NOT, so a plain
#     cmake build fails on the missing pigpio.h and there is no daemon to run.
#   * Build pigpio v79 from source into the DESTDIR stage and package its three
#     .so's (libpigpio / libpigpiod_if / libpigpiod_if2) plus the `pigpiod`
#     binary alongside the driver, and ship a pigpiod.service. Pass the pigpio
#     install_manifest.txt as an extra --manifest so those files land in the
#     .deb. The recipe on the issue (build pigpio v79 -> /usr/local, systemd
#     unit for /usr/local/bin/pigpiod) is the reference.
#   * I2C (0x48/0x49/0x4b) must be enabled on the Pi for the V/A readouts;
#     that is a raspi-config step, not a package dependency.

# dpkg package name. Match the upstream indi-3rdparty package.
DEB_PACKAGE="indi-asi-power"

# Runtime deps. libpigpiod-if2-1 is present on trixie (the client lib the
# driver links); the pigpiod daemon + its libs are bundled into this .deb from
# the DESTDIR stage (see the note above), so they are not apt dependencies.
DEB_DEPENDS="libindidriver1, libindiclient1, libi2c0"

# One-line summary (the apt short description).
DEB_DESC_SHORT="INDI driver for ASIAIR Pro power ports (DanWBR build)"

# Extended description (multi-line ok; build-driver-deb.sh indents it).
DEB_DESC_LONG="INDI Auxiliary driver exposing the four 12 V outputs of the
ASIAIR Pro enclosure as a Power Box (on/off or 1 kHz PWM per port), with the
DSLR shutter line and per-port voltage/current readouts. Rebuilt by the
N.I.N.A. Polaris project for Debian 13, bundling pigpio (headers, client libs
and the pigpiod daemon) which trixie no longer packages, so it installs with a
single apt/dpkg step instead of a from-source build. See issue #8."
