# Per-package config for build-driver-deb.sh — ZWO ASI (indi-asi).
#
# Sourced as bash. One file per upstream driver group you maintain. Copy this
# for indi-svbony / indi-playerone / indi-gphoto / ... changing the four values.

# dpkg package name. Match the upstream indi-3rdparty package so a future move
# to a real apt repo stays consistent.
DEB_PACKAGE="indi-asi"

# Runtime deps. The libindi*1 soname pins the ABI: if libindi ever bumps to
# soname 2, apt refuses to install this driver instead of letting it crash.
# libusb is needed by the SDK. Adjust per driver (gphoto needs libgphoto2, etc.).
DEB_DEPENDS="libindidriver1, libindiclient1, libindialignmentdriver1, libusb-1.0-0"

# One-line summary (the apt short description).
DEB_DESC_SHORT="INDI drivers for ZWO ASI cameras (DanWBR build)"

# Extended description (multi-line ok; build-driver-deb.sh indents it).
DEB_DESC_LONG="ZWO ASI camera, focuser, filter-wheel and ST4 INDI drivers,
rebuilt by the N.I.N.A. Polaris project with field fixes and bundling the
libASICamera2 SDK. Replaces the source-built (make install) drivers shipped
on the Polaris SBC images so they can be updated via apt/dpkg."
