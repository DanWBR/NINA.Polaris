# Per-package config for build-driver-deb.sh: Sky-Watcher EQMod (indi-eqmod,
# from indi-3rdparty). Built from tag v2.2.5, the first release carrying both
# Wave home-indexer fixes (#1336 Wave 150i, #1382 Wave 100i). The EQMod on
# every published image predates them, so Find Home on a Wave answers with an
# INDI alert and the RA keeps the firmware's home convention, 6 h off.
#
# One build per image family, each compiled in a chroot of that image so it
# links the INDI core the image actually runs (2.2.2 on all of them):
#   * Debian 13 (rpi4, rpi5): the core is a source build in /usr that no
#     package owns, so pass --require-file for libindidriver.so.2 and
#     libindiAlignmentDriver.so.2; Depends cannot express it.
#   * Ubuntu 22.04 (opi4pro, opizero3) and 24.04 (radxa-dragon-q6a): the core
#     is the PPA's libindi1 2.2.2, a real dependency. The PPA no longer
#     publishes for either series, so there is no apt route to a newer EQMod.
#     Jammy has no libindi-dev; build against the 24.04 image's headers, which
#     come from the same PPA snapshot (2.2.2+202606010554).
#   * Ubuntu 26.04 (opi5pro) needs no build: the PPA ships the drivers there as
#     indi-3rdparty-drivers, and apt upgrades it.
# build-in-image.sh does all of this per family (Depends from dpkg-shlibdeps
# plus libindi1, the preinst guard, the 22.04 headers):
#   bash build-in-image.sh --conf packages/indi-eqmod.conf \
#        --image <board>-polaris-v<ver>.7z --family deb13|ubuntu22.04|ubuntu24.04
#
# Version: <EQMod version>+t<v2.2.5 commit timestamp>+danwbrN~<distro>, the
# PPA's own scheme, so it sorts above the PPA builds on the images (1.3+t2026..)
# and below any later upstream build.

# Upstream source, for build-in-image.sh.
SRC_REPO="https://github.com/indilib/indi-3rdparty.git"
SRC_TAG="v2.2.5"
SRC_DIR="indi-eqmod"
DEB_VERSION="1.4+t202609230749+danwbr1"

# dpkg package name. Same as the PPA's and Debian's, so installing it upgrades
# the indi-eqmod package where one is installed (rpi5, the Ubuntu images).
DEB_PACKAGE="indi-eqmod"

# Fallback only; every build passes --depends.
DEB_DEPENDS="libindidriver1"

# One-line summary (the apt short description).
DEB_DESC_SHORT="INDI driver for Sky-Watcher mounts, EQMod (DanWBR build)"

# Extended description (multi-line ok; build-driver-deb.sh indents it).
DEB_DESC_LONG="EQMod INDI driver for Sky-Watcher equatorial mounts, plus the AZ-GTi
and Star Adventurer GTi / 2i drivers, from indi-3rdparty v2.2.5. Adds Find Home
on the Wave 150i and Wave 100i. Rebuilt by the Polaris project against the
INDI core shipped on the Polaris SBC images."
